<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>لـ (كنزي) 👀</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      overflow: hidden;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .card {
      background: rgba(255,255,255,0.1);
      padding: 25px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 25px rgba(0,0,0,0.4);
      animation: fadeIn 2s;
      z-index: 2;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    p {
      opacity: 0.8;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #00c6ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0072ff;
    }

    #msg {
      margin-top: 20px;
      font-size: 18px;
      display: none;
      animation: fadeIn 1s;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    /* قلوب */
    .heart {
      position: absolute;
      color: rgba(255, 0, 100, 0.7);
      animation: float 6s linear infinite;
    }

    @keyframes float {
      from {
        transform: translateY(100vh) scale(0.5);
        opacity: 1;
      }
      to {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <h1 id="name"></h1>
    <p>في حاجة معمولالك مخصوص 👀</p>
    <button onclick="showMsg()">اضغطي هنا</button>
    <div id="msg">أنا عملت ده عشانك 💙</div>
  </div>

  <script>
    // كتابة الاسم تدريجي
    let text = "لـ (كنزي) 💙";
    let i = 0;

    function type() {
      if(i < text.length){
        document.getElementById("name").innerHTML += text.charAt(i);
        i++;
        setTimeout(type, 80);
      }
    }
    type();

    // إظهار الرسالة
    function showMsg() {
      document.getElementById("msg").style.display = "block";
    }

    // قلوب متحركة
    function createHeart() {
      let heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (Math.random() * 20 + 10) + "px";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    setInterval(createHeart, 500);
  </script>

</body>
</html>
