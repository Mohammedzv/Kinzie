<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>رسالة ليكي 💙</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    .box {
      background: rgba(255,255,255,0.1);
      padding: 25px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 25px rgba(0,0,0,0.4);
      max-width: 90%;
      animation: fade 2s ease;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 15px;
    }

    p {
      line-height: 1.8;
      font-size: 18px;
      opacity: 0.9;
    }

    .btn {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #ff4d6d;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background: #ff1e50;
    }

    @keyframes fade {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    /* قلوب */
    .heart {
      position: absolute;
      color: rgba(255, 0, 100, 0.6);
      animation: float 6s linear infinite;
    }

    @keyframes float {
      from {
        transform: translateY(100vh) scale(0.5);
        opacity: 1;
      }
      to {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

  </style>
</head>

<body>

  <div class="box">
    <h1>💙 رسالة ليكي</h1>

    <p>
      يمكن الكلام مش دايمًا بيعبر…<br>
      بس أنا حبيت أعمل حاجة تفضل موجودة.<br><br>

      وجودك فرق معايا أكتر مما تتخيلي…<br>
      وخلاني أتعلم أعمل حاجات أنا نفسي مبسوط بيها.<br><br>

      مش عايز حاجة غير إنك تبتسمي بس لما تشوفي ده 💙
    </p>

    <a class="btn" href="index.html">ارجعي 👈</a>
  </div>

  <script>
    function createHeart() {
      let heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (Math.random() * 20 + 10) + "px";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    setInterval(createHeart, 500);
  </script>

</body>
</html>
